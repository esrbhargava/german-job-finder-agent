name: Daily German Job Digest

on:
  schedule:
    # Runs every day at 07:00 UTC (8:00 AM German Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium

      - name: Run Job Finder Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push updated digest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily job digest [skip ci]"
          file_pattern: "data/*"
          skip_dirty_check: true
          skip_empty_commit: true